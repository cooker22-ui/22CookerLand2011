<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lambda Menu</title>

<style>
:root{--bg:#000;--panel:#050505;--fg:#ff9f1a;--accent:#ffb04d;--line:#222}
html,body{margin:0;height:100%;background:#000;color:var(--fg);font-family:Tahoma,Verdana,sans-serif;overflow:hidden}

/* BACKGROUND */
#bg{position:fixed;inset:0;pointer-events:none;z-index:0}
#bg::before{
 content:"01001101 01000001 01010100 01010010 01001001 01011000 01001000 01001100 01001100 01000001 01001101 01000010 01000100 01000001 01001101 01000101 01001110 01010101";
 white-space:pre;position:absolute;inset:0;
 font-family:Consolas,monospace;font-size:14px;line-height:1.4;
 color:rgba(255,159,26,.18);
 animation:scroll 30s linear infinite;
}
@keyframes scroll{to{transform:translateY(-50%)}}

/* LAYOUT */
#app{display:flex;height:100%;position:relative;z-index:1}
#menu{width:320px;padding:22px;border-right:1px solid #111;background:#080808}
.menu{padding:10px;margin:6px 0;cursor:pointer}
.menu:hover{background:rgba(255,159,26,.12)}
#content{flex:1;display:grid;place-items:center}

.panel{width:860px;height:600px;border:1px solid #222;background:#050505;position:relative}
.flex{display:flex;gap:8px;flex-wrap:wrap;padding:10px}
button{background:#111;color:var(--fg);border:1px solid #333;padding:6px 10px}

/* GAME WINDOW */
.window{
 position:absolute;width:720px;height:520px;
 background:#050505;border:1px solid #222;
 display:none;box-shadow:0 0 20px rgba(0,0,0,.8)
}
.window-bar{
 height:28px;background:#0b0b0b;border-bottom:1px solid #111;
 display:flex;justify-content:space-between;align-items:center;
 padding:0 8px;cursor:move;font-family:Consolas;font-size:12px
}
.window-body{position:absolute;inset:28px 0 0 0;padding:6px}
.window-close{background:#111;border:1px solid #333;color:var(--fg)}

/* WIKI */
#wikiDock{
 position:absolute;right:20px;bottom:20px;
 width:380px;height:480px;
 background:#050505;border:1px solid #222;
 resize:both;overflow:hidden
}
#wikiHead{cursor:move;padding:6px;border-bottom:1px solid #111}

/* CRT */
#crt{position:fixed;inset:0;pointer-events:none;z-index:50}
#crt::before{
 content:"";position:absolute;inset:0;
 background:repeating-linear-gradient(
  to bottom,
  rgba(255,255,255,.03),
  rgba(255,255,255,.03) 1px,
  rgba(0,0,0,.05) 2px
 );
}

/* EASTER EGG */
#easter{
 position:fixed;left:8px;bottom:6px;
 font-family:Consolas;font-size:11px;
 opacity:.08;pointer-events:none
}
</style>
</head>

<body>
<div id="bg"></div>

<div id="app">
 <div id="menu">
  <h2>LAMBDA MENU</h2>
  <div class="menu" onclick="pong()">PONG</div>
  <div class="menu" onclick="tetris()">TETRIS</div>
  <div class="menu" onclick="snake()">SNAKE</div>
 </div>

 <div id="content">
  <div class="panel">

   <!-- GAME WINDOW -->
   <div id="gameWin" class="window">
    <div class="window-bar" id="gameBar">
     <span id="gameTitle">GAME</span>
     <button class="window-close" onclick="closeGame()">X</button>
    </div>
    <div class="window-body">
     <canvas id="gameCanvas" width="640" height="420"></canvas>
    </div>
   </div>

   <!-- WIKI -->
   <div id="wikiDock">
    <div id="wikiHead">Half‑Life (1998)</div>
    <div style="padding:8px;font-size:13px">
     Gordon Freeman survives MIT.
    </div>
   </div>

  </div>
 </div>
</div>

<div id="crt"></div>
<div id="easter">terry davis was here</div>

<script>
/* GAME WINDOW */
const win=document.getElementById('gameWin');
const bar=document.getElementById('gameBar');
const title=document.getElementById('gameTitle');
let dx,dy,drag=false,z=10;

bar.onmousedown=e=>{
 drag=true;dx=e.clientX-win.offsetLeft;dy=e.clientY-win.offsetTop;
 win.style.zIndex=++z;
};
document.onmousemove=e=>{
 if(!drag)return;
 win.style.left=e.clientX-dx+'px';
 win.style.top=e.clientY-dy+'px';
};
document.onmouseup=()=>drag=false;

function openGame(name){
 title.textContent=name;
 win.style.display='block';
 win.style.left='360px';
 win.style.top='120px';
 win.style.zIndex=++z;
}
function closeGame(){win.style.display='none'}

/* GAME STUBS */
function pong(){openGame('PONG')}
function tetris(){openGame('TETRIS')}
function snake(){openGame('SNAKE')}
</script>
</body>
</html>
